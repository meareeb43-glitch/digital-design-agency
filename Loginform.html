<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .Login-form {
            background-color: #F2F6FF;
            height: fit-content;
            padding: 5px 20px 15px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 20rem;
        }

        .Form {
            text-align: center;
        }

        .form-heading {
            background-color: transparent;
            color: black;
            height: fit-content;
            padding: 18px 5px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;
            text-align: center;
        }

        .username,
        .passsword {
            position: relative;
        }

        .user-icon,
        .lock-icon {
            position: absolute;
            right: 12px;
            top: 55%;
            color: #ccc;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 25px 5px;
            margin-bottom: 2px;
            border-radius: 20px;
            background-color: transparent;
            border: 1px solid black;
        }

        .password-field {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .password-field1 {
            display: flex;
            gap: 4px;
        }

        input[type="checkbox"] {
            width: 8px;
            position: relative;
            bottom: 1px;
            color: white;
            left: 2px;
        }

        .password-verification {
            font-size: 10px;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #6724F9;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: small;
            border-radius: 20px;
            border: 1px solid white;
            padding: 10px;
            margin: 20px 5px;
        }

        input[type="submit"]:hover {
            background-color: #4500b5;
        }

        .acc-verification {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 0px;
            font-size: small;
        }

        a {
            text-decoration: none;
            color: #6724F9;
        }
    </style>
</head>

<body>
    <div class="Login-form" id="Login-form">
        <form action="" method="get">
            <h1 class="form-heading">Login Form</h1>
            <div class="username">
                <input type="text" name="username" id="username" placeholder="Username">
                <i class="fa-solid fa-user user-icon"></i>
            </div>
            <div class="passsword">
                <input type="password" id="password" placeholder="Password">
                <i class="fa-solid fa-lock lock-icon"></i>
            </div>
            <div class="password-field">
                <div class="password-field1">
                    <input type="checkbox" id="Remember me" value="Remember me" name="Remember me">
                    <label class="password-verification" for="Remember me">Remember me</label>
                </div>
                <a href="">
                    <p class="password-verification">Forget Password?</p>
                </a>
            </div>
            <input type="submit" value="Login">
            <div class="acc-verification">
                <p>Don't you have an account?</p>
                <a href="signupform.html">Signup</a>
            </div>
            <a href="index.html"
                style="display: block; text-align: center; margin-top: 10px; font-size: 13px; color: #6724F9;">
                ← Back to home
            </a>
        </form>
    </div>
</body>

</html>
